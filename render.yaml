services:
  - type: web
    runtime: python
    name: punto-de-venta-cauloti
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate && python manage.py seed_demo
    startCommand: gunicorn cauloti_pos.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CAULOTI_DEBUG
        value: "0"
      - key: CAULOTI_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CAULOTI_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CAULOTI_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cauloti-pos-db
          property: connectionString

databases:
  - name: cauloti-pos-db
    plan: free

