{% extends "base.html" %}

{% block page_title %}Nueva categoria{% endblock %}
{% block page_subtitle %}Clasificacion del catalogo{% endblock %}

{% block content %}
  <section class="panel narrow">
    <form method="post" class="form-stack">
      {% csrf_token %}
      {% for field in form %}
        <label>
          {{ field.label }}
          {{ field }}
          {% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
        </label>
      {% endfor %}
      <div class="form-actions">
        <a class="button" href="{% url 'category_list' %}">Cancelar</a>
        <button class="button button-primary" type="submit">Guardar</button>
      </div>
    </form>
  </section>
{% endblock %}
